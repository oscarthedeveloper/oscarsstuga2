# ===================================================================
# NETLIFY
#
# Bygget är en ren statisk export — ingen Next-runtime, inga
# serverfunktioner, ingen plugin. Netlify serverar mappen `out` rakt av.
#
# Miljövariablerna sätts i Netlify: Site configuration → Environment
# variables. Lägg NEXT_PUBLIC_SUPABASE_URL och
# NEXT_PUBLIC_SUPABASE_ANON_KEY där. Utan dem byggs appen ändå, men utan
# molnfunktioner.
# ===================================================================

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Supabase-klienten kräver Node 22. På 20 bygger den, men varnar vid
  # varje paket och slutar fungera i en kommande version.
  NODE_VERSION = "22"

  # ------------------------------------------------------------------
  # MOLNNYCKLARNA
  #
  # De står här, i repot, och inte i Netlifys gränssnitt. Det är ett
  # medvetet val efter att bygget gång på gång visat att variablerna från
  # gränssnittet aldrig nådde fram — loggen listade noll NEXT_PUBLIC_-
  # variabler. Här kan de inte hamna fel: filen är samma sak som bygget
  # läser, och den syns i git-historiken.
  #
  # Är det säkert? Ja, och inte tack vare hemlighetsmakeri. Anon-nyckeln
  # skickas till varje besökare i JavaScript-bunten ändå — den ÄR publik,
  # det är vad `anon` betyder. Att den också ligger i repot ändrar
  # ingenting. Det som skyddar innehållet är radnivåsäkerheten i
  # databasen, där varje rad är knuten till auth.uid().
  #
  # Service role-nyckeln är motsatsen: den går förbi RLS helt och får
  # ALDRIG stå här, i .env-filer, eller någon annanstans i klientkoden.
  #
  # Vill du hellre ha dem i Netlifys gränssnitt: ta bort de två raderna
  # nedan, lägg in dem under Site configuration → Environment variables
  # med scope som omfattar Builds, och kontrollera i deploy-loggen att
  # rutan säger "MOLNET: inkopplat".
  # ------------------------------------------------------------------
  NEXT_PUBLIC_SUPABASE_URL = "https://nftxdboilciytjppelnd.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mdHhkYm9pbGNpeXRqcHBlbG5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzQ0NjMsImV4cCI6MjEwMjA1MDQ2M30.S-_FHX18AeNCKofztjCsUS7zK9J99e_f6Fb6iA9z57U"

  # ------------------------------------------------------------------
  # HEMLIGHETSSÖKNINGEN
  #
  # Netlify genomsöker det färdiga bygget efter värden som matchar dina
  # miljövariabler, och AVBRYTER deployen om den hittar några. Avsikten är
  # god — den fångar en läckt service-nyckel — men den kan inte veta att
  # NEXT_PUBLIC_* är avsedda att hamna i klientkoden. Det är hela poängen
  # med prefixet.
  #
  # Utan det här undantaget misslyckas alltså varje deploy från och med
  # den stund variablerna lagts in, och Netlify fortsätter servera den
  # SENASTE LYCKADE deployen — den från innan nycklarna fanns. Resultatet
  # ser ut precis som om variablerna aldrig sattes: ny kod, inga nycklar.
  # ------------------------------------------------------------------
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

# -------------------------------------------------------------------
# HUVUDEN
# -------------------------------------------------------------------

# Service workern får ALDRIG cachas av webbläsaren. Gör den det kan en
# gammal arbetare hålla kvar en gammal app i evighet, och användaren har
# ingen väg ur det utom att rensa webbplatsdata.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Next ger varje bunt ett innehållshash i filnamnet. En fil med ett visst
# namn kan därför aldrig ändras, och får cachas för alltid.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
